[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myportal-agent-harness"
version = "0.1.0"
description = "MyPortal AI Agent Harness with FastAPI backend and GLM-5 integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.13.2",
    "fastapi",
    "httpx",
    "numpy>=2.4.4",
    "pydantic",
    "pypdf>=6.10.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.26",
    "python-pptx>=1.0.2",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
myportal-api = "harness_app.access.api_gateway.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
